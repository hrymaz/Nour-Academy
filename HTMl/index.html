<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Nour Académie</title>
</head>

<body>

    <main>

        <header>
            <div class="logo">
                <img src="../img/Nour.png" alt="Logo Nour Académie">
            </div>

            <div id="search-bar">
                <input type="text" id="search" name="search" placeholder="Rechercher un cours...">

                <button type="button" aria-label="Rechercher">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"
                        fill="#1f1f1f">
                        <path
                            d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                    </svg>
                </button>
            </div>
        </header>

        <section id="Accueil">
            <div class="paret-1">
                <h1>Chaque réussite commence par le bon cours.</h1>
            </div>

            <div>
                <img src="../img/Nour-class.jpg" alt="Classe de Nour Académie">
            </div>
        </section>

        <div id="filtres">
            <select id="filtre-niveau" name="filtre-niveau">
                <option value="">Tous les niveaux</option>
                <option value="Collège">Collège</option>
                <option value="Tronc commun">Tronc commun</option>
                <option value="1ère Bac">1ère Bac</option>
                <option value="2ème Bac">2ème Bac</option>
            </select>

            <select id="filtre-matiere" name="filtre-matiere">
                <option value="">Toutes les matières</option>
                <option value="Mathématiques">Mathématiques</option>
                <option value="Physique-Chimie">Physique-Chimie</option>
                <option value="SVT">SVT</option>
                <option value="Français">Français</option>
            </select>
        </div>

        <div id="courses-container"></div>

        <div id="ajute">
            <h3>Mes cours choisis</h3>
            <div id="panier-items"></div>
            <p id="total">Total : 0 MAD / mois</p>
        </div>


        <section id="inscription" class="inscription-section">
            <div class="inscription-container">

                <h2>Inscrivez-vous maintenant</h2>
                <p>Remplissez le formulaire pour choisir votre cours.</p>

                <form class="formulaire" id="form-inscription">

                    <div class="form-group">
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" name="nom" placeholder="Votre nom complet" required>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">Numéro WhatsApp</label>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="+212 6 XX XX XX XX" required>
                    </div>

                    <div class="form-group">
                        <label for="cours">Cours souhaité</label>
                        <select id="cours" name="cours" required>
                            <option value="">Choisir un cours</option>
                            <option value="Mathématiques">Mathématiques</option>
                            <option value="Physique-Chimie">Physique-Chimie</option>
                            <option value="Français">Français</option>
                            <option value="Anglais">Anglais</option>
                            <option value="SVT">SVT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nombre-enfants">Nombre d'enfants</label>
                        <input type="number" id="nombre-enfants" name="nombre-enfants" value="1" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="niveau">Niveau scolaire</label>
                        <select id="niveau" name="niveau" required>
                            <option value="">Choisir un niveau</option>
                            <option value="Collège">Collège</option>
                            <option value="Tronc commun">Tronc commun</option>
                            <option value="1ère Bac">1ère Bac</option>
                            <option value="2ème Bac">2ème Bac</option>
                        </select>
                    </div>

                    <button type="submit">S'inscrire</button>

                </form>
            </div>
        </section>

    </main>

    <script src="../JS/script.js"></script>

</body>

</html>
